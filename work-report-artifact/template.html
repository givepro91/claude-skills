<title>{{제품 · 주제}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root {
  --ground: #edf0f5; --surface: #ffffff; --surface-2: #f5f7fb; --ink: #1b2233; --muted: #5b6479; --line: #d6dbe5;
  --navy: #22304f; --navy-ink: #f4f6fb; --gold: #e9a800; --gold-soft: #fff1c2;
  --ok: #1f7a4d; --ok-soft: #dcf2e6; --warn: #9a5b00; --warn-soft: #fbe9c8;
  --display: "Black Han Sans", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #10151f; --surface: #182030; --surface-2: #1e273a; --ink: #e7ebf3; --muted: #9aa3b8; --line: #2c374d;
  --navy: #0b1120; --navy-ink: #f4f6fb; --gold: #ffc83d; --gold-soft: #3a2f10; --ok: #6fd3a0; --ok-soft: #173427; --warn: #f3b857; --warn-soft: #3a2b12; } }
:root[data-theme="dark"] {
  --ground: #10151f; --surface: #182030; --surface-2: #1e273a; --ink: #e7ebf3; --muted: #9aa3b8; --line: #2c374d;
  --navy: #0b1120; --navy-ink: #f4f6fb; --gold: #ffc83d; --gold-soft: #3a2f10; --ok: #6fd3a0; --ok-soft: #173427; --warn: #f3b857; --warn-soft: #3a2b12; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.7; word-break: keep-all; }
img, video { max-width: 100%; display: block; }
.masthead { background: var(--navy); color: var(--navy-ink); padding: 44px 20px 36px; }
.masthead .inner, .wrap { max-width: 68rem; margin: 0 auto; }
.wrap { padding: 0 20px 56px; }
.eyebrow { font-size: 13px; letter-spacing: 0.08em; color: #c9d2e6; margin: 0 0 10px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(38px, 7vw, 62px); line-height: 1.05; margin: 0; color: #ffc83d; text-wrap: balance; }
.lede { max-width: 40rem; margin: 16px 0 0; font-size: 18px; color: #e4e9f4; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; margin: 28px 0 0; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.12); }
.facts div { background: var(--navy); padding: 12px 16px; }
.facts dt { font-size: 12px; letter-spacing: 0.06em; color: #aeb8cf; }
.facts dd { margin: 2px 0 0; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; color: #fff; }
section { padding-block: 48px 4px; }
h2 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.2; margin: 0 0 8px; text-wrap: balance; }
h2 .tag { font-family: var(--body); font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); vertical-align: middle; margin-left: 10px; }
h3 { font-size: 17px; margin: 0 0 6px; font-weight: 600; }
.prose { max-width: 42rem; }
.prose p { margin: 0 0 12px; }
ul.plain { margin: 0; padding-left: 1.1em; }
ul.plain li { margin: 0 0 6px; }
ul.plain li::marker { color: var(--gold); }
code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.86em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.quote { border-left: 3px solid var(--gold); padding: 2px 0 2px 14px; margin: 0 0 14px; color: var(--muted); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 300px); gap: 28px; align-items: start; margin-top: 18px; }
@media (max-width: 720px) { .split { grid-template-columns: 1fr; } }
figure { margin: 0; }
figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; }
.phone { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #0c1220; }
.shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 22px; }
table.data { border-collapse: collapse; width: 100%; max-width: 44rem; margin-top: 14px; font-size: 14px; font-variant-numeric: tabular-nums; }
table.data th, table.data td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: right; }
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data thead th { font-size: 12px; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; }
.tablewrap { overflow-x: auto; }
.state { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 4px; margin-right: 6px; }
.state.ok { background: var(--ok-soft); color: var(--ok); }
.state.no { background: var(--warn-soft); color: var(--warn); }
.rows { margin-top: 16px; border-top: 1px solid var(--line); }
.rows > div { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
@media (max-width: 560px) { .rows > div { grid-template-columns: 1fr; gap: 2px; } }
.rows dt { font-weight: 600; }
.rows dd { margin: 0; }
ol.next { margin: 12px 0 0; padding-left: 1.3em; max-width: 44rem; }
ol.next li { margin: 0 0 10px; }
</style>

<header class="masthead">
  <div class="inner">
    <p class="eyebrow">{{날짜 · 원작자 인용 한 토막 · 과업 id}}</p>
    <h1>{{그 세션의 명제 한 줄}}</h1>
    <p class="lede">{{무엇이 문제였고 무엇을 했나, 두 문장}}</p>
    <dl class="facts">
      <div><dt>커밋</dt><dd>{{n}}</dd></div>
      <div><dt>{{측정 이름}}</dt><dd>{{값}}</dd></div>
      <div><dt>{{기기}}</dt><dd>{{상태}}</dd></div>
      <div><dt>기존 검사</dt><dd>{{a}} / {{b}} 통과</dd></div>
    </dl>
  </div>
</header>

<main class="wrap">
  <section>
    <h2>{{작업 하나}} <span class="tag">{{누가 요청 · 어느 화면}}</span></h2>
    <div class="split">
      <div class="prose">
        <p class="quote">「{{원작자 원문 그대로}}」</p>
        <p>{{전에는 어땠나.}}</p>
        <p>{{지금은 어떤가.}}</p>
      </div>
      <figure>
        <img class="phone" src="media/{{capture}}.jpg" alt="{{그림 설명}}">
        <figcaption>{{기기 · 조건}}</figcaption>
      </figure>
    </div>
  </section>

  <section>
    <h2>기기</h2>
    <dl class="rows">
      <div><dt>{{기기}}</dt><dd><span class="state ok">최종 빌드</span>{{무엇을 봤나}}</dd></div>
      <div><dt>{{기기}}</dt><dd><span class="state no">미확인</span>{{왜 못 봤나}}</dd></div>
    </dl>
  </section>

  <section>
    <h2>남은 것</h2>
    <ol class="next">
      <li><strong>{{이름}}.</strong> {{원작자가 정할 것 한 문장}}</li>
    </ol>
  </section>
</main>
